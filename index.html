<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Person 3D Physics Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
        
        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: difference;
            display: none;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            z-index: 20;
        }

        #toolbar {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        #pause-overlay {
            pointer-events: auto;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .playing #pause-overlay { display: none; }
        .playing #toolbar { pointer-events: none; opacity: 0.2; transition: opacity 0.3s; }
        .playing #crosshair { display: block; }

    </style>
    
    <!-- Import Maps for Three.js and Cannon-es -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-layer" class="text-white font-sans">
        
        <!-- Tools Panel -->
        <div id="toolbar" class="w-72 h-full flex flex-col p-6 shadow-2xl transition-all">
            <h1 class="text-2xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">Physics FP</h1>
            <p class="text-sm text-gray-400 mb-8">Press ESC to unlock mouse & use tools.</p>
            
            <div class="space-y-4 flex-grow">
                <div class="border-b border-gray-700 pb-4 mb-4">
                    <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-3">Spawn Objects</h2>
                    <button id="btn-cube" class="w-full text-left px-4 py-3 bg-gray-800 hover:bg-gray-700 rounded-lg mb-2 transition flex justify-between items-center group">
                        Spawn Cube <span class="text-xs text-gray-500 group-hover:text-white">C</span>
                    </button>
                    <button id="btn-sphere" class="w-full text-left px-4 py-3 bg-gray-800 hover:bg-gray-700 rounded-lg mb-2 transition flex justify-between items-center group">
                        Spawn Sphere <span class="text-xs text-gray-500 group-hover:text-white">V</span>
                    </button>
                    <button id="btn-random" class="w-full text-left px-4 py-3 bg-blue-600 hover:bg-blue-500 rounded-lg transition shadow-lg shadow-blue-500/20 font-medium">
                        Spawn Random Shape
                    </button>
                </div>

                <div>
                    <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-3">World Settings</h2>
                    <button id="btn-gravity" class="w-full text-left px-4 py-3 bg-indigo-900/50 hover:bg-indigo-800 rounded-lg mb-2 border border-indigo-500/30 transition flex justify-between items-center">
                        Gravity: <span id="gravity-status" class="text-emerald-400 font-bold">ON</span>
                    </button>
                    <button id="btn-clear" class="w-full text-left px-4 py-3 bg-red-900/40 hover:bg-red-800 rounded-lg border border-red-500/30 transition text-red-200 mt-4">
                        Clear All Objects
                    </button>
                </div>
            </div>
            
            <div class="mt-auto pt-6 border-t border-gray-700 text-xs text-gray-500 leading-relaxed">
                <p><strong>W A S D</strong> - Move</p>
                <p><strong>Space</strong> - Jump</p>
                <p><strong>Left Click</strong> - Grab & Hold Object</p>
            </div>
        </div>

        <!-- Pause Overlay / Resume Area -->
        <div id="pause-overlay" class="group">
            <div class="text-center transform transition-transform group-hover:scale-105">
                <div class="text-5xl font-black mb-4 tracking-tight drop-shadow-lg">GAME PAUSED</div>
                <div class="text-xl text-gray-300 bg-black/50 px-6 py-3 rounded-full border border-gray-600 inline-block">
                    Click anywhere to resume
                </div>
            </div>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import * as CANNON from 'cannon-es';

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, controls;
        let world;
        let meshes = [];
        let bodies = [];
        
        // Player Mechanics
        let playerBody;
        const playerRadius = 1.5;
        const playerMass = 50;
        let canJump = false;
        
        // Grab Mechanics
        let raycaster;
        let grabbedBody = null;
        let grabConstraint = null;
        let kinematicHoldBody = null;
        let holdDistance = 5;

        // Input state
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let gravityEnabled = true;

        // Materials
        const physicsMaterial = new CANNON.Material('standard');
        const physicsContactMaterial = new CANNON.ContactMaterial(physicsMaterial, physicsMaterial, {
            friction: 0.3,
            restitution: 0.4,
        });

        init();
        animate();

        function init() {
            // 1. THREE.JS SETUP
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 2. LIGHTING
            const ambientLight = new THREE.AmbientLight(0x404040, 2.5); // Soft white light
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 150;
            dirLight.shadow.camera.left = -50;
            dirLight.shadow.camera.right = 50;
            dirLight.shadow.camera.top = 50;
            dirLight.shadow.camera.bottom = -50;
            scene.add(dirLight);

            // 3. CANNON.JS SETUP (PHYSICS)
            world = new CANNON.World();
            world.gravity.set(0, -15, 0); // Slightly stronger gravity for better feel
            world.broadphase = new CANNON.SAPBroadphase(world);
            world.addContactMaterial(physicsContactMaterial);

            // 4. ENVIRONMENT (FLOOR)
            createFloor();
            createWalls();
            
            // Add some initial objects
            for(let i=0; i<10; i++) spawnRandomShape(true);

            // 5. PLAYER SETUP (First Person Physics)
            const playerShape = new CANNON.Sphere(playerRadius);
            playerBody = new CANNON.Body({
                mass: playerMass,
                material: physicsMaterial,
                fixedRotation: true // Prevent player from tumbling
            });
            playerBody.addShape(playerShape);
            playerBody.position.set(0, 5, 10);
            playerBody.linearDamping = 0.9; // Friction to stop sliding
            world.addBody(playerBody);

            // 6. GRAB MECHANICS SETUP
            raycaster = new THREE.Raycaster();
            
            // Kinematic body used as an anchor point for grabbing objects
            kinematicHoldBody = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC });
            world.addBody(kinematicHoldBody);

            // 7. CONTROLS (PointerLock)
            controls = new PointerLockControls(camera, document.body);
            
            const pauseOverlay = document.getElementById('pause-overlay');
            pauseOverlay.addEventListener('click', () => { controls.lock(); });

            controls.addEventListener('lock', () => { document.body.classList.add('playing'); });
            controls.addEventListener('unlock', () => { document.body.classList.remove('playing'); releaseObject(); });

            // 8. EVENT LISTENERS
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);

            // UI Buttons
            document.getElementById('btn-cube').addEventListener('click', () => spawnCube());
            document.getElementById('btn-sphere').addEventListener('click', () => spawnSphere());
            document.getElementById('btn-random').addEventListener('click', () => spawnRandomShape());
            document.getElementById('btn-clear').addEventListener('click', clearObjects);
            document.getElementById('btn-gravity').addEventListener('click', toggleGravity);
        }

        // --- ENVIRONMENT CREATION ---
        function createFloor() {
            // Three.js Floor
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            
            // Checkerboard pattern
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const context = canvas.getContext('2d');
            context.fillStyle = '#1e293b'; context.fillRect(0, 0, 512, 512);
            context.fillStyle = '#334155';
            for(let i=0; i<8; i++) {
                for(let j=0; j<8; j++) {
                    if((i+j)%2 === 0) context.fillRect(i*64, j*64, 64, 64);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(10, 10);

            const floorMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8 });
            const floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // Cannon.js Floor
            const floorShape = new CANNON.Plane();
            const floorBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
            floorBody.addShape(floorShape);
            floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(floorBody);
        }

        function createWalls() {
            const wallThickness = 2;
            const wallHeight = 20;
            const wallSize = 100;
            const wallColor = 0x64748b;

            const positions = [
                [0, wallHeight/2, -wallSize/2], [0, wallHeight/2, wallSize/2],
                [-wallSize/2, wallHeight/2, 0], [wallSize/2, wallHeight/2, 0]
            ];
            const rotations = [0, 0, Math.PI/2, Math.PI/2];

            for (let i = 0; i < 4; i++) {
                // Three.js
                const geo = new THREE.BoxGeometry(wallSize, wallHeight, wallThickness);
                const mat = new THREE.MeshStandardMaterial({ color: wallColor });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(...positions[i]);
                mesh.rotation.y = rotations[i];
                mesh.receiveShadow = true;
                scene.add(mesh);

                // Cannon.js
                const shape = new CANNON.Box(new CANNON.Vec3(wallSize/2, wallHeight/2, wallThickness/2));
                const body = new CANNON.Body({ mass: 0, material: physicsMaterial });
                body.addShape(shape);
                body.position.set(...positions[i]);
                body.quaternion.setFromEuler(0, rotations[i], 0);
                world.addBody(body);
            }
        }

        // --- SPANWING OBJECTS ---
        function addPhysicsObject(mesh, body) {
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            world.addBody(body);
            
            // Link them
            mesh.userData.physicsBody = body;
            body.userData = { mesh: mesh };
            
            meshes.push(mesh);
            bodies.push(body);
        }

        function getRandomColor() {
            const colors = [0xf87171, 0x60a5fa, 0x34d399, 0xfbbf24, 0xa78bfa, 0xf472b6, 0x2dd4bf];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function getSpawnPosition(randomSpread = false) {
            // Spawn slightly in front of the player and up
            const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            direction.y = 0;
            direction.normalize();
            
            const pos = new CANNON.Vec3(
                playerBody.position.x + direction.x * 4,
                playerBody.position.y + 5,
                playerBody.position.z + direction.z * 4
            );

            if (randomSpread) {
                pos.x += (Math.random() - 0.5) * 40;
                pos.z += (Math.random() - 0.5) * 40;
                pos.y += Math.random() * 20 + 5;
            }
            return pos;
        }

        function spawnCube(randomSpread = false) {
            const size = Math.random() * 1.5 + 0.5;
            const geo = new THREE.BoxGeometry(size*2, size*2, size*2);
            const mat = new THREE.MeshStandardMaterial({ color: getRandomColor(), roughness: 0.4, metalness: 0.1 });
            const mesh = new THREE.Mesh(geo, mat);

            const shape = new CANNON.Box(new CANNON.Vec3(size, size, size));
            const body = new CANNON.Body({ mass: size * 5, material: physicsMaterial });
            body.addShape(shape);
            body.position.copy(getSpawnPosition(randomSpread));
            
            addPhysicsObject(mesh, body);
        }

        function spawnSphere(randomSpread = false) {
            const radius = Math.random() * 1 + 0.5;
            const geo = new THREE.SphereGeometry(radius, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ color: getRandomColor(), roughness: 0.2, metalness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);

            const shape = new CANNON.Sphere(radius);
            const body = new CANNON.Body({ mass: radius * 5, material: physicsMaterial });
            body.addShape(shape);
            body.position.copy(getSpawnPosition(randomSpread));
            
            addPhysicsObject(mesh, body);
        }

        function spawnCylinder(randomSpread = false) {
            const radius = Math.random() * 1 + 0.5;
            const height = Math.random() * 2 + 1;
            const geo = new THREE.CylinderGeometry(radius, radius, height, 32);
            const mat = new THREE.MeshStandardMaterial({ color: getRandomColor(), roughness: 0.6 });
            const mesh = new THREE.Mesh(geo, mat);

            // Cannon's Cylinder axis is Z by default, Three is Y. Need to rotate shape.
            const shape = new CANNON.Cylinder(radius, radius, height, 16);
            const body = new CANNON.Body({ mass: (radius * radius * height) * 3, material: physicsMaterial });
            const q = new CANNON.Quaternion();
            q.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2); // Align Z axis to Y axis
            body.addShape(shape, new CANNON.Vec3(0,0,0), q);
            body.position.copy(getSpawnPosition(randomSpread));
            
            addPhysicsObject(mesh, body);
        }

        function spawnRandomShape(spread = false) {
            const rand = Math.random();
            if(rand < 0.33) spawnCube(spread);
            else if (rand < 0.66) spawnSphere(spread);
            else spawnCylinder(spread);
        }

        // --- TOOLS / UI FUNCTIONS ---
        function clearObjects() {
            releaseObject();
            for (let i = 0; i < meshes.length; i++) {
                scene.remove(meshes[i]);
                meshes[i].geometry.dispose();
                meshes[i].material.dispose();
                world.removeBody(bodies[i]);
            }
            meshes = [];
            bodies = [];
        }

        function toggleGravity() {
            gravityEnabled = !gravityEnabled;
            world.gravity.set(0, gravityEnabled ? -15 : 0, 0);
            
            // Wake all bodies up so they float if gravity turned off
            bodies.forEach(b => b.wakeUp());

            const status = document.getElementById('gravity-status');
            status.innerText = gravityEnabled ? "ON" : "OFF";
            status.className = gravityEnabled ? "text-emerald-400 font-bold" : "text-red-400 font-bold";
        }

        // --- INPUT HANDLING ---
        function onKeyDown(event) {
            if (!controls.isLocked) return;
            switch(event.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
                case 'Space': 
                    keys.space = true; 
                    if (canJump) {
                        playerBody.velocity.y = 10; 
                        canJump = false;
                    }
                    break;
            }
        }

        function onKeyUp(event) {
            switch(event.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
                case 'Space': keys.space = false; break;
                // Quick spawn shortcuts
                case 'KeyC': if(controls.isLocked) spawnCube(); break;
                case 'KeyV': if(controls.isLocked) spawnSphere(); break;
            }
        }

        function onMouseDown(event) {
            if (!controls.isLocked || event.button !== 0) return; // Only Left click

            // Raycast from center of screen
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const hitBody = hitMesh.userData.physicsBody;
                
                // Don't grab extremely heavy objects or floor/walls
                if (hitBody && hitBody.mass > 0) {
                    grabbedBody = hitBody;
                    
                    // Calculate distance to hold object
                    holdDistance = intersects[0].distance;
                    if (holdDistance < 3) holdDistance = 3;
                    if (holdDistance > 10) holdDistance = 10; // Max reach

                    // Wake it up
                    grabbedBody.wakeUp();

                    // Create a PointToPoint constraint between kinematic hold body and grabbed body
                    // First, position kinematic body at the exact hit point
                    const hitPoint = intersects[0].point;
                    kinematicHoldBody.position.set(hitPoint.x, hitPoint.y, hitPoint.z);

                    // Add constraint
                    // Link the exact hit point on the grabbed body to the kinematic body
                    const localPivot = new CANNON.Vec3();
                    grabbedBody.pointToLocalFrame(new CANNON.Vec3(hitPoint.x, hitPoint.y, hitPoint.z), localPivot);
                    
                    grabConstraint = new CANNON.PointToPointConstraint(
                        grabbedBody, localPivot, 
                        kinematicHoldBody, new CANNON.Vec3(0,0,0)
                    );
                    
                    world.addConstraint(grabConstraint);

                    // Slightly reduce damping so it swings realistically but doesn't fly infinitely
                    grabbedBody.linearDamping = 0.5;
                    grabbedBody.angularDamping = 0.5;
                }
            }
        }

        function onMouseUp(event) {
            if (event.button === 0) releaseObject();
        }

        function releaseObject() {
            if (grabConstraint) {
                world.removeConstraint(grabConstraint);
                grabConstraint = null;
                
                if (grabbedBody) {
                    grabbedBody.linearDamping = 0.01; // Restore normal damping
                    grabbedBody.angularDamping = 0.01;
                    
                    // Add slight throw velocity based on camera direction
                    const throwDir = new THREE.Vector3();
                    camera.getWorldDirection(throwDir);
                    // Add current player velocity to the object for momentum transfer
                    const throwVelocity = throwDir.multiplyScalar(5).add(
                        new THREE.Vector3(playerBody.velocity.x, playerBody.velocity.y, playerBody.velocity.z).multiplyScalar(0.5)
                    );
                    
                    grabbedBody.velocity.x += throwVelocity.x;
                    grabbedBody.velocity.y += throwVelocity.y;
                    grabbedBody.velocity.z += throwVelocity.z;
                }
                
                grabbedBody = null;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- UPDATE LOOP ---
        const clock = new THREE.Clock();
        const walkSpeed = 350;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1); // Cap delta time

            // Physics step
            world.step(1/60, delta, 3);

            // 1. Sync Physics bodies to Three.js meshes
            for (let i = 0; i < meshes.length; i++) {
                meshes[i].position.copy(bodies[i].position);
                meshes[i].quaternion.copy(bodies[i].quaternion);
            }

            // 2. Handle Player Movement
            if (controls.isLocked) {
                // Determine forward and right directions based on camera yaw
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0; // Keep movement on XZ plane
                forward.normalize();
                
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();

                const targetVelocity = new THREE.Vector3(0, 0, 0);
                
                if (keys.w) targetVelocity.add(forward);
                if (keys.s) targetVelocity.sub(forward);
                if (keys.d) targetVelocity.add(right);
                if (keys.a) targetVelocity.sub(right);

                if (targetVelocity.length() > 0) targetVelocity.normalize();
                targetVelocity.multiplyScalar(walkSpeed * delta);

                // Apply velocity, keeping existing Y velocity (for gravity/jumping)
                playerBody.velocity.x = targetVelocity.x;
                playerBody.velocity.z = targetVelocity.z;

                // Check Grounding using Raycast down
                const rayStart = new CANNON.Vec3(playerBody.position.x, playerBody.position.y, playerBody.position.z);
                const rayEnd = new CANNON.Vec3(playerBody.position.x, playerBody.position.y - playerRadius - 0.2, playerBody.position.z);
                const rayResult = new CANNON.RaycastResult();
                world.raycastClosest(rayStart, rayEnd, { skipBackfaces: true }, rayResult);
                
                canJump = rayResult.hasHit;
            }

            // Sync Camera to Player physics body (at eye level)
            camera.position.copy(playerBody.position);
            camera.position.y += playerRadius * 0.5; // Eye height slightly above center

            // 3. Handle Grabbed Object
            if (grabbedBody && grabConstraint) {
                // Calculate desired hold position in front of camera
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                
                const desiredPos = camera.position.clone().add(direction.multiplyScalar(holdDistance));
                
                // Move the kinematic anchor body to this position smoothly
                // We use interpolation for a slightly springy/smooth follow effect
                kinematicHoldBody.position.x += (desiredPos.x - kinematicHoldBody.position.x) * 10 * delta;
                kinematicHoldBody.position.y += (desiredPos.y - kinematicHoldBody.position.y) * 10 * delta;
                kinematicHoldBody.position.z += (desiredPos.z - kinematicHoldBody.position.z) * 10 * delta;
            }

            // Render
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
