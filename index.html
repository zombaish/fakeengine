<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Physics Engine Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; touch-action: none; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas by default */
            display: flex;
            flex-direction: column;
            padding: 1rem;
            box-sizing: border-box;
        }

        .panel {
            pointer-events: auto; /* Enable clicks on UI panels */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn.active-mode {
            background: rgba(59, 130, 246, 0.6); /* Blue tint for active state */
            border-color: rgba(96, 165, 250, 1);
        }

        /* Custom scrollbar for tools */
        .tools-scroll::-webkit-scrollbar { width: 6px; }
        .tools-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        .tools-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
        
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            display: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="ui-layer">
        <div class="flex justify-between items-start w-full max-w-7xl mx-auto h-full">
            
            <!-- Left Panel: Tools -->
            <div class="panel w-64 max-h-full flex flex-col gap-4 overflow-y-auto tools-scroll">
                <div>
                    <h1 class="text-xl font-bold mb-1 tracking-tight">Physics Engine</h1>
                    <p class="text-xs text-gray-300 mb-4 opacity-80">Interactive 3D Playground</p>
                </div>
                
                <div class="space-y-2">
                    <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-2">Interaction Mode</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btn-mode-camera" class="btn active-mode text-xs" onclick="setMode('camera')">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Camera
                        </button>
                        <button id="btn-mode-drag" class="btn text-xs" onclick="setMode('drag')">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path></svg>
                            Drag
                        </button>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-1" id="mode-hint">Left click & drag to rotate camera.</p>
                </div>

                <hr class="border-gray-500 opacity-30 my-2">

                <div class="space-y-2">
                    <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-2">Spawn Shapes</h2>
                    <button class="btn w-full justify-start" onclick="spawnShape('box')">📦 Add Cube</button>
                    <button class="btn w-full justify-start" onclick="spawnShape('sphere')">⚽ Add Sphere</button>
                    <button class="btn w-full justify-start" onclick="spawnShape('cylinder')">🛢️ Add Cylinder</button>
                    <button class="btn w-full justify-start" onclick="spawnShape('random')">🎲 Random Shape</button>
                    <button class="btn w-full justify-start !bg-indigo-600/50 hover:!bg-indigo-600/70" onclick="spawnMany()">🌧️ Spawn Rain (x20)</button>
                </div>

                <hr class="border-gray-500 opacity-30 my-2">

                <div class="space-y-2 mt-auto">
                    <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-2">Environment</h2>
                    <button id="btn-gravity" class="btn w-full justify-between" onclick="toggleGravity()">
                        <span>Gravity</span>
                        <span id="gravity-status" class="text-green-400 font-bold">ON</span>
                    </button>
                    <button class="btn w-full justify-center !bg-red-500/30 hover:!bg-red-500/50 !border-red-500/50" onclick="clearScene()">
                        🗑️ Clear All
                    </button>
                </div>
            </div>

            <!-- Right Panel: Stats (Optional, keeping it minimal) -->
            <div class="panel hidden md:block text-right">
                <div class="text-xs text-gray-300 uppercase tracking-wider">Objects</div>
                <div id="obj-count" class="text-2xl font-bold font-mono">0</div>
            </div>
            
        </div>
    </div>

    <script>
        // Global variables for Three.js and Cannon.js
        let scene, camera, renderer, orbitControls;
        let world;
        let objects = []; // Keep track of meshes and bodies
        
        // Interaction variables
        let mode = 'camera'; // 'camera' or 'drag'
        let raycaster, mouse;
        let dragPlane;
        let jointBody, mouseConstraint;
        let isDragging = false;
        
        // Physics materials
        let physicsMaterial;
        
        // Constants
        const GRAVITY = -9.82;
        let isGravityOn = true;

        // Initialize application
        init();
        animate();

        function init() {
            // 1. Setup Three.js Scene
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;
            orbitControls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Soft white light
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            // Grid helper
            const gridHelper = new THREE.GridHelper(100, 100, 0x444444, 0x222222);
            gridHelper.position.y = 0.01; // Slightly above ground to prevent z-fighting
            scene.add(gridHelper);

            // 2. Setup Cannon.js World
            world = new CANNON.World();
            world.gravity.set(0, GRAVITY, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;
            
            // Physics materials setup
            physicsMaterial = new CANNON.Material("standard");
            const physicsContactMaterial = new CANNON.ContactMaterial(
                physicsMaterial,
                physicsMaterial,
                {
                    friction: 0.3,
                    restitution: 0.6 // Bounciness
                }
            );
            world.addContactMaterial(physicsContactMaterial);

            // Ground Plane (Physics & Visual)
            const groundShape = new CANNON.Plane();
            const groundBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
            groundBody.addShape(groundShape);
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);

            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x111111,
                roughness: 0.8,
                metalness: 0.2
            });
            const groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            // 3. Setup Interaction mechanics (Drag & Drop)
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Invisible plane for dragging objects across
            const planeGeo = new THREE.PlaneGeometry(1000, 1000);
            const planeMat = new THREE.MeshBasicMaterial({ visible: false });
            dragPlane = new THREE.Mesh(planeGeo, planeMat);
            scene.add(dragPlane);

            // Kinematic body to represent the mouse position in physics world
            jointBody = new CANNON.Body({ mass: 0 });
            jointBody.collisionFilterGroup = 0;
            jointBody.collisionFilterMask = 0;
            world.addBody(jointBody);

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            
            // Interaction events (mouse/touch)
            const canvas = renderer.domElement;
            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);
            canvas.addEventListener('pointercancel', onPointerUp);

            // Initial spawn
            spawnShape('box', {x: 0, y: 5, z: 0}, 2);
            spawnShape('sphere', {x: -2, y: 8, z: 1}, 1.5);
            updateObjectCount();
        }

        // Function to create a random bright color
        function getRandomColor() {
            const hue = Math.random();
            const saturation = 0.7 + Math.random() * 0.3; // 0.7 - 1.0
            const lightness = 0.4 + Math.random() * 0.2;  // 0.4 - 0.6
            return new THREE.Color().setHSL(hue, saturation, lightness);
        }

        // Main function to spawn objects
        function spawnShape(type, position = null, size = null) {
            if (type === 'random') {
                const types = ['box', 'sphere', 'cylinder'];
                type = types[Math.floor(Math.random() * types.length)];
            }

            const pos = position || {
                x: (Math.random() - 0.5) * 10,
                y: 10 + Math.random() * 10,
                z: (Math.random() - 0.5) * 10
            };

            const s = size || (0.5 + Math.random() * 1.5);
            const mass = s * 2; // Heavier if larger
            const color = getRandomColor();

            let geometry, shape;

            switch(type) {
                case 'box':
                    geometry = new THREE.BoxGeometry(s, s, s);
                    shape = new CANNON.Box(new CANNON.Vec3(s/2, s/2, s/2));
                    break;
                case 'sphere':
                    geometry = new THREE.SphereGeometry(s/2, 32, 32);
                    shape = new CANNON.Sphere(s/2);
                    break;
                case 'cylinder':
                    geometry = new THREE.CylinderGeometry(s/2, s/2, s, 32);
                    shape = new CANNON.Cylinder(s/2, s/2, s, 32);
                    // Cannon.js cylinder aligns along Z axis, Three.js along Y axis. Fix rotation later.
                    break;
            }

            // Three.js Mesh
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.1
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // Cannon.js Body
            const body = new CANNON.Body({
                mass: mass,
                material: physicsMaterial,
                position: new CANNON.Vec3(pos.x, pos.y, pos.z)
            });

            // Handle Cylinder rotation mismatch between Threejs and Cannonjs
            if (type === 'cylinder') {
                const q = new CANNON.Quaternion();
                q.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
                body.addShape(shape, new CANNON.Vec3(0,0,0), q);
            } else {
                body.addShape(shape);
            }
            
            // Add some initial random rotation
            body.quaternion.setFromEuler(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            
            world.addBody(body);

            // Link them together
            mesh.userData.physicsBody = body;
            body.userData = { isInteractable: true };

            objects.push({ mesh, body });
            updateObjectCount();
        }

        function spawnMany() {
            for(let i=0; i<20; i++) {
                setTimeout(() => {
                    spawnShape('random');
                }, i * 100); // Stagger spawns to prevent physics explosions
            }
        }

        function clearScene() {
            objects.forEach(obj => {
                scene.remove(obj.mesh);
                if (obj.mesh.geometry) obj.mesh.geometry.dispose();
                if (obj.mesh.material) obj.mesh.material.dispose();
                world.remove(obj.body);
            });
            objects = [];
            updateObjectCount();
        }

        function toggleGravity() {
            isGravityOn = !isGravityOn;
            if (isGravityOn) {
                world.gravity.set(0, GRAVITY, 0);
                document.getElementById('gravity-status').textContent = 'ON';
                document.getElementById('gravity-status').className = 'text-green-400 font-bold';
                // Wake up all bodies so they fall
                objects.forEach(obj => obj.body.wakeUp());
            } else {
                world.gravity.set(0, 0, 0);
                document.getElementById('gravity-status').textContent = 'OFF';
                document.getElementById('gravity-status').className = 'text-red-400 font-bold';
            }
        }

        function updateObjectCount() {
            document.getElementById('obj-count').innerText = objects.length;
        }

        function setMode(newMode) {
            mode = newMode;
            
            const btnCamera = document.getElementById('btn-mode-camera');
            const btnDrag = document.getElementById('btn-mode-drag');
            const hint = document.getElementById('mode-hint');

            if (mode === 'camera') {
                btnCamera.classList.add('active-mode');
                btnDrag.classList.remove('active-mode');
                orbitControls.enabled = true;
                hint.innerText = "Left click & drag to rotate camera.";
                document.getElementById('canvas-container').style.cursor = 'default';
                document.getElementById('crosshair').style.display = 'none';
            } else {
                btnCamera.classList.remove('active-mode');
                btnDrag.classList.add('active-mode');
                orbitControls.enabled = false;
                hint.innerText = "Click & drag objects to move them physically.";
                document.getElementById('canvas-container').style.cursor = 'crosshair';
                document.getElementById('crosshair').style.display = 'block';
            }
        }

        function onPointerDown(event) {
            if (mode !== 'drag') return;

            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Intersect against all meshes in objects array
            const interactableMeshes = objects.map(o => o.mesh);
            const intersects = raycaster.intersectObjects(interactableMeshes);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const hitMesh = hit.object;
                const hitBody = hitMesh.userData.physicsBody;

                if (hitBody) {
                    isDragging = true;
                    
                    // Set invisible plane to face camera and sit at the depth of the hit object
                    dragPlane.position.copy(hit.point);
                    dragPlane.quaternion.copy(camera.quaternion);

                    // Wake up body if sleeping
                    hitBody.wakeUp();

                    // Move joint body to hit point
                    jointBody.position.copy(hit.point);

                    // Add a constraint between the mouse joint and the body
                    // We connect it at the exact point we clicked relative to the body's center
                    const localPivot = new CANNON.Vec3();
                    hitBody.pointToLocalFrame(new CANNON.Vec3(hit.point.x, hit.point.y, hit.point.z), localPivot);

                    mouseConstraint = new CANNON.PointToPointConstraint(jointBody, new CANNON.Vec3(0,0,0), hitBody, localPivot);
                    
                    // Allow some stretch for realistic pulling feel
                    mouseConstraint.collideConnected = false;
                    world.addConstraint(mouseConstraint);
                }
            }
        }

        function onPointerMove(event) {
            if (!isDragging || mode !== 'drag') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Intersect with invisible plane to find 3D mouse position
            const intersects = raycaster.intersectObject(dragPlane);

            if (intersects.length > 0) {
                const hitPoint = intersects[0].point;
                // Update the kinematic body position to follow mouse
                jointBody.position.copy(hitPoint);
            }
        }

        function onPointerUp() {
            if (isDragging) {
                isDragging = false;
                if (mouseConstraint) {
                    world.removeConstraint(mouseConstraint);
                    mouseConstraint = null;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Step physics world (60fps)
            const timeStep = 1.0 / 60.0;
            world.step(timeStep);

            // Sync Three.js meshes with Cannon.js bodies
            objects.forEach(obj => {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
                
                // If objects fall too far, reset them or remove them
                if (obj.body.position.y < -50) {
                    // Simple respawn logic instead of deleting to keep things active
                    obj.body.position.set( (Math.random()-0.5)*20, 20, (Math.random()-0.5)*20 );
                    obj.body.velocity.set(0,0,0);
                    obj.body.angularVelocity.set(0,0,0);
                }
            });

            orbitControls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
