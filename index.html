<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Physics Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); pointer-events: none; opacity: 0.7;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: white; box-shadow: 0 0 2px black;
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* Tools Menu */
        #toolbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; pointer-events: auto; background: rgba(0,0,0,0.5);
            padding: 10px; border-radius: 15px; backdrop-filter: blur(5px);
        }
        .tool-btn {
            background: rgba(255,255,255,0.1); color: white; border: 2px solid transparent;
            padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; user-select: none; -webkit-user-select: none;
        }
        .tool-btn.active { background: rgba(59, 130, 246, 0.8); border-color: #60a5fa; box-shadow: 0 0 10px rgba(59,130,246,0.5); }
        .tool-btn:hover:not(.active) { background: rgba(255,255,255,0.2); }

        /* Mobile Controls */
        .mobile-controls { display: none; pointer-events: auto; }
        @media (hover: none) and (pointer: coarse) {
            .mobile-controls { display: block; }
            #instructions { display: none !important; }
        }
        
        .joystick-zone { position: absolute; bottom: 80px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); touch-action: none; }
        #move-zone { left: 20px; }
        #look-zone { right: 20px; }
        .joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.5); transform: translate(-50%, -50%); box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: none; }
        
        #action-btn {
            position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
            width: 70px; height: 70px; border-radius: 50%; background: rgba(239, 68, 68, 0.6);
            border: 3px solid rgba(255,255,255,0.5); color: white; font-weight: bold;
            display: flex; justify-content: center; align-items: center; pointer-events: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 14px;
        }
        #action-btn:active { background: rgba(239, 68, 68, 0.9); transform: translateY(-50%) scale(0.95); }

        #instructions {
            position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.6);
            padding: 15px; border-radius: 10px; font-family: sans-serif; pointer-events: none;
            text-shadow: 1px 1px 2px black; border: 1px solid rgba(255,255,255,0.2);
        }
        
        #blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; color: white; pointer-events: auto; cursor: pointer;
        }
    </style>
    <!-- Import Maps for Three.js and Cannon-es -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div id="crosshair"></div>
        
        <div id="instructions">
            <h2 class="text-xl font-bold mb-2 text-blue-300">Physics Playground</h2>
            <p><b>Click</b> to Play (Locks Mouse)</p>
            <p><b>WASD</b> - Move | <b>Space</b> - Jump</p>
            <p><b>Mouse</b> - Look Around</p>
            <p><b>Click</b> - Use Active Tool</p>
            <p class="text-gray-400 text-sm mt-2">Press ESC to unlock mouse</p>
        </div>

        <div id="toolbar">
            <button class="tool-btn active" data-tool="spawn">Spawn Shape</button>
            <button class="tool-btn" data-tool="grab">Grab Object</button>
            <button class="tool-btn" data-tool="push">Force Push</button>
            <button class="tool-btn" data-tool="delete">Delete</button>
        </div>

        <!-- Mobile specific controls -->
        <div class="mobile-controls">
            <div id="move-zone" class="joystick-zone"><div class="joystick-knob" id="move-knob"></div></div>
            <div id="look-zone" class="joystick-zone"><div class="joystick-knob" id="look-knob"></div></div>
            <div id="action-btn">ACTION</div>
        </div>
        
        <div id="blocker" class="hidden">
            <h1 class="text-4xl font-bold mb-4">Click to Start</h1>
            <p class="text-xl text-gray-300">Enter Physics Playground</p>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, world;
        let timeStep = 1 / 60;
        let lastCallTime;
        const objectsToUpdate = [];
        
        // Player state
        let playerBody;
        const moveVelocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let canJump = false;
        const velocity = new CANNON.Vec3();
        
        // Input state
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let isPointerLocked = false;
        
        // Tools
        let currentTool = 'spawn';
        let raycaster = new THREE.Raycaster();
        let centerVector = new THREE.Vector2(0, 0); // Center of screen
        
        // Grabbing state
        let grabConstraint = null;
        let kinematicGrabBody = null;
        let isGrabbing = false;

        // Mobile Controls State
        let isMobile = false;
        let moveTouchId = null, lookTouchId = null;
        let moveInput = { x: 0, y: 0 }; // -1 to 1
        const lookSensitivity = 0.005;

        init();
        animate();

        function init() {
            isMobile = window.matchMedia("(pointer: coarse)").matches || 'ontouchstart' in window;

            // --- 1. Three.js Setup ---
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Soft white
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2);
            dirLight.position.set(20, 50, -20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 150;
            const d = 50;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // --- 2. Cannon.js Physics Setup ---
            world = new CANNON.World();
            world.gravity.set(0, -9.81, 0); // Earth gravity
            world.broadphase = new CANNON.SAPBroadphase(world);
            
            // Materials
            const physicsMaterial = new CANNON.Material("standard");
            const physicsContactMaterial = new CANNON.ContactMaterial(
                physicsMaterial, physicsMaterial, { friction: 0.3, restitution: 0.3 }
            );
            world.addContactMaterial(physicsContactMaterial);
            
            // Player Physics Material (low friction so we don't stick to walls)
            const playerPhysMaterial = new CANNON.Material("player");
            const playerFloorContact = new CANNON.ContactMaterial(
                playerPhysMaterial, physicsMaterial, { friction: 0.0, restitution: 0.0 }
            );
            world.addContactMaterial(playerFloorContact);

            // --- 3. Create Environment ---
            // Floor Graphics
            const floorGeometry = new THREE.PlaneGeometry(200, 200);
            floorGeometry.rotateX(-Math.PI / 2);
            
            // Create a checkerboard texture procedurally
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,512,512);
            ctx.fillStyle = '#cccccc';
            for(let i=0; i<8; i++) {
                for(let j=0; j<8; j++) {
                    if ((i+j)%2 === 0) ctx.fillRect(i*64, j*64, 64, 64);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(40, 40);

            const floorMaterial = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8, metalness: 0.1 });
            const floorMesh = new THREE.Mesh(floorGeometry, floorMaterial);
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // Floor Physics
            const floorShape = new CANNON.Plane();
            const floorBody = new CANNON.Body({ mass: 0, shape: floorShape, material: physicsMaterial });
            floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(floorBody);

            // Add some random initial objects
            for(let i=0; i<15; i++) {
                spawnRandomShape(
                    Math.random() * 20 - 10,
                    Math.random() * 10 + 2,
                    Math.random() * 20 - 10
                );
            }

            // --- 4. Player Setup ---
            const radius = 1;
            const playerShape = new CANNON.Sphere(radius);
            playerBody = new CANNON.Body({
                mass: 70, // kg
                material: playerPhysMaterial,
                position: new CANNON.Vec3(0, 5, 10),
                type: CANNON.Body.DYNAMIC,
                fixedRotation: true, // Don't roll
                linearDamping: 0.9 // High damping for snappy FPS control
            });
            playerBody.addShape(playerShape);
            world.addBody(playerBody);

            // Check if grounded
            playerBody.addEventListener("collide", function(e) {
                const contact = e.contact;
                if(contact.ni.dot(new CANNON.Vec3(0,1,0)) > 0.5) canJump = true;
            });

            // Kinematic body for grabbing
            kinematicGrabBody = new CANNON.Body({
                mass: 0,
                type: CANNON.Body.KINEMATIC,
                position: new CANNON.Vec3(0, 0, 0)
            });
            world.addBody(kinematicGrabBody);

            // --- 5. Controls & Events ---
            setupInput();
            setupUI();
            
            if(!isMobile) {
                document.getElementById('blocker').classList.remove('hidden');
            } else {
                document.getElementById('blocker').style.display = 'none';
            }

            window.addEventListener('resize', onWindowResize);
        }

        // --- RANDOM SHAPE GENERATOR ---
        function spawnRandomShape(x, y, z) {
            const types = ['box', 'sphere', 'cylinder'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            const color = new THREE.Color().setHSL(Math.random(), 0.7, 0.5);
            const material = new THREE.MeshStandardMaterial({ 
                color: color, roughness: 0.4, metalness: 0.1 
            });

            let mesh, shape, mass;
            const size = Math.random() * 1.5 + 0.5;

            if (type === 'box') {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), material);
                shape = new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2));
                mass = size * 5;
            } else if (type === 'sphere') {
                mesh = new THREE.Mesh(new THREE.SphereGeometry(size/2, 32, 32), material);
                shape = new CANNON.Sphere(size/2);
                mass = size * 5;
            } else { // cylinder
                mesh = new THREE.Mesh(new THREE.CylinderGeometry(size/2, size/2, size, 32), material);
                shape = new CANNON.Cylinder(size/2, size/2, size, 32);
                // Rotate cylinder to match Cannon's orientation
                const q = new CANNON.Quaternion();
                q.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
                const transform = new CANNON.Transform();
                transform.quaternion.copy(q);
                // In modern cannon-es, cylinder z-axis is up. Threejs y-axis is up.
                // We add shape with a quaternion offset.
                const physMaterial = world.contactmaterials[0].materials[0]; // Get default mat
                mass = size * 5;
                
                const body = new CANNON.Body({ mass, position: new CANNON.Vec3(x, y, z), material: physMaterial });
                body.addShape(shape, new CANNON.Vec3(0,0,0), q);
                
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                world.addBody(body);
                objectsToUpdate.push({ mesh, body });
                return;
            }

            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const physMaterial = world.contactmaterials[0].materials[0];
            const body = new CANNON.Body({ mass, shape, position: new CANNON.Vec3(x, y, z), material: physMaterial });
            world.addBody(body);

            objectsToUpdate.push({ mesh, body });
        }

        // --- INPUT HANDLING ---
        function setupInput() {
            // Desktop Pointer Lock
            if (!isMobile) {
                const blocker = document.getElementById('blocker');
                blocker.addEventListener('click', () => {
                    document.body.requestPointerLock();
                });

                document.addEventListener('pointerlockchange', () => {
                    if (document.pointerLockElement === document.body) {
                        isPointerLocked = true;
                        blocker.classList.add('hidden');
                    } else {
                        isPointerLocked = false;
                        blocker.classList.remove('hidden');
                        releaseGrab(); // Drop object if unlocked
                    }
                });

                document.addEventListener('mousemove', (event) => {
                    if (!isPointerLocked) return;
                    euler.y -= event.movementX * 0.002;
                    euler.x -= event.movementY * 0.002;
                    euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x)); // Clamp vertical look
                    camera.quaternion.setFromEuler(euler);
                });

                document.addEventListener('mousedown', (e) => {
                    if (!isPointerLocked || e.button !== 0) return;
                    handleToolAction(true);
                });
                
                document.addEventListener('mouseup', (e) => {
                    if (!isPointerLocked || e.button !== 0) return;
                    handleToolAction(false);
                });
            } else {
                // Mobile Joysticks & Touch
                setupMobileTouch();
            }

            // Keyboard (WASD)
            document.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = true; break;
                    case 'KeyA': keys.a = true; break;
                    case 'KeyS': keys.s = true; break;
                    case 'KeyD': keys.d = true; break;
                    case 'Space': 
                        if(canJump && (isPointerLocked || isMobile)) {
                            playerBody.velocity.y = 8;
                            canJump = false;
                        }
                        break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': keys.w = false; break;
                    case 'KeyA': keys.a = false; break;
                    case 'KeyS': keys.s = false; break;
                    case 'KeyD': keys.d = false; break;
                }
            });
        }

        function setupMobileTouch() {
            const moveZone = document.getElementById('move-zone');
            const lookZone = document.getElementById('look-zone');
            const moveKnob = document.getElementById('move-knob');
            const lookKnob = document.getElementById('look-knob');
            const actionBtn = document.getElementById('action-btn');

            let moveCenter = { x: 0, y: 0 };
            let lookCenter = { x: 0, y: 0 };

            // Move Joystick
            moveZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                moveTouchId = touch.identifier;
                const rect = moveZone.getBoundingClientRect();
                moveCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
                updateMoveJoystick(touch);
            });
            moveZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === moveTouchId) {
                        updateMoveJoystick(e.changedTouches[i]);
                    }
                }
            });
            const stopMove = (e) => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === moveTouchId) {
                        moveTouchId = null;
                        moveInput = { x: 0, y: 0 };
                        moveKnob.style.transform = `translate(-50%, -50%)`;
                    }
                }
            };
            moveZone.addEventListener('touchend', stopMove);
            moveZone.addEventListener('touchcancel', stopMove);

            function updateMoveJoystick(touch) {
                let dx = touch.clientX - moveCenter.x;
                let dy = touch.clientY - moveCenter.y;
                const distance = Math.min(Math.sqrt(dx*dx + dy*dy), 50); // Max radius 50
                const angle = Math.atan2(dy, dx);
                
                const knobX = Math.cos(angle) * distance;
                const knobY = Math.sin(angle) * distance;
                
                moveKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
                
                // Normalize for movement logic (-1 to 1)
                moveInput.x = knobX / 50;
                moveInput.y = knobY / 50;
            }

            // Look Joystick (Acts like dragging a mouse)
            let lastLook = { x: 0, y: 0 };
            lookZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lastLook = { x: touch.clientX, y: touch.clientY };
                
                const rect = lookZone.getBoundingClientRect();
                lookCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
                updateLookJoystick(touch);
            });
            
            lookZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === lookTouchId) {
                        const touch = e.changedTouches[i];
                        const dx = touch.clientX - lastLook.x;
                        const dy = touch.clientY - lastLook.y;
                        
                        // Apply rotation
                        euler.y -= dx * lookSensitivity;
                        euler.x -= dy * lookSensitivity;
                        euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
                        camera.quaternion.setFromEuler(euler);
                        
                        lastLook = { x: touch.clientX, y: touch.clientY };
                        updateLookJoystick(touch);
                    }
                }
            });

            const stopLook = (e) => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === lookTouchId) {
                        lookTouchId = null;
                        lookKnob.style.transform = `translate(-50%, -50%)`;
                    }
                }
            };
            lookZone.addEventListener('touchend', stopLook);
            lookZone.addEventListener('touchcancel', stopLook);

            function updateLookJoystick(touch) {
                 let dx = touch.clientX - lookCenter.x;
                let dy = touch.clientY - lookCenter.y;
                const distance = Math.min(Math.sqrt(dx*dx + dy*dy), 50); 
                const angle = Math.atan2(dy, dx);
                const knobX = Math.cos(angle) * distance;
                const knobY = Math.sin(angle) * distance;
                lookKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
            }

            // Action Button
            actionBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleToolAction(true); });
            actionBtn.addEventListener('touchend', (e) => { e.preventDefault(); handleToolAction(false); });
        }


        // --- TOOL UI & LOGIC ---
        function setupUI() {
            const btns = document.querySelectorAll('.tool-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Stop event from propagating to canvas
                    e.stopPropagation();
                    
                    // Update UI
                    btns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // Set logic
                    currentTool = btn.dataset.tool;
                    releaseGrab(); // Ensure we don't hold something when switching tools
                    
                    // Focus back to game on desktop
                    if(!isMobile && !isPointerLocked) document.body.requestPointerLock();
                });
            });
        }

        function handleToolAction(isDown) {
            if (currentTool === 'grab') {
                if (isDown) tryGrab();
                else releaseGrab();
            } else if (isDown) {
                // One-click tools
                executeOneClickTool();
            }
        }

        function getLookingAt() {
            raycaster.setFromCamera(centerVector, camera);
            // Intersect with scene meshes (skip floor if we don't want to interact with it, but we can just filter later)
            const intersects = raycaster.intersectObjects(scene.children);
            // Filter out lights and floor
            return intersects.find(hit => hit.object.geometry && hit.object.geometry.type !== 'PlaneGeometry' && hit.distance < 20);
        }

        function executeOneClickTool() {
            if (currentTool === 'spawn') {
                // Spawn 3 units in front of camera
                const spawnPos = new THREE.Vector3(0, 0, -3);
                spawnPos.applyQuaternion(camera.quaternion);
                spawnPos.add(camera.position);
                spawnRandomShape(spawnPos.x, spawnPos.y + 1, spawnPos.z);
            } 
            else if (currentTool === 'delete') {
                const hit = getLookingAt();
                if (hit) {
                    const objData = objectsToUpdate.find(o => o.mesh === hit.object);
                    if (objData) {
                        scene.remove(objData.mesh);
                        world.removeBody(objData.body);
                        objectsToUpdate.splice(objectsToUpdate.indexOf(objData), 1);
                    }
                }
            }
            else if (currentTool === 'push') {
                const hit = getLookingAt();
                if (hit) {
                    const objData = objectsToUpdate.find(o => o.mesh === hit.object);
                    if (objData) {
                        // Apply strong impulse outward from camera
                        const impulseVec = new THREE.Vector3(0, 0, -1);
                        impulseVec.applyQuaternion(camera.quaternion);
                        impulseVec.multiplyScalar(objData.body.mass * 15); // Scale force by mass
                        
                        const hitPoint = new CANNON.Vec3(hit.point.x, hit.point.y, hit.point.z);
                        objData.body.applyImpulse(new CANNON.Vec3(impulseVec.x, impulseVec.y, impulseVec.z), hitPoint);
                    }
                }
            }
        }

        function tryGrab() {
            const hit = getLookingAt();
            if (hit) {
                const objData = objectsToUpdate.find(o => o.mesh === hit.object);
                if (objData) {
                    isGrabbing = true;
                    // Position kinematic body at hit point
                    kinematicGrabBody.position.copy(hit.point);
                    
                    // Create point-to-point constraint (a spring-like feel)
                    // We attach the kinematic body to the hit point on the dynamic body
                    const localPivot = new CANNON.Vec3();
                    objData.body.pointToLocalFrame(new CANNON.Vec3(hit.point.x, hit.point.y, hit.point.z), localPivot);
                    
                    grabConstraint = new CANNON.PointToPointConstraint(
                        kinematicGrabBody, new CANNON.Vec3(0,0,0),
                        objData.body, localPivot
                    );
                    
                    world.addConstraint(grabConstraint);
                }
            }
        }

        function releaseGrab() {
            if (isGrabbing && grabConstraint) {
                world.removeConstraint(grabConstraint);
                grabConstraint = null;
                isGrabbing = false;
            }
        }

        // --- UPDATE LOOP ---
        function updatePlayerMovement(dt) {
            const speed = 250; // Acceleration scalar
            moveVelocity.set(0, 0, 0);

            if (!isMobile) {
                if (keys.w) moveVelocity.z -= 1;
                if (keys.s) moveVelocity.z += 1;
                if (keys.a) moveVelocity.x -= 1;
                if (keys.d) moveVelocity.x += 1;
            } else {
                // Mobile joystick input
                moveVelocity.x = moveInput.x;
                moveVelocity.z = moveInput.y;
            }

            moveVelocity.normalize();
            
            // Convert local input to world direction based on camera yaw
            direction.copy(moveVelocity);
            direction.applyEuler(new THREE.Euler(0, euler.y, 0, 'YXZ'));
            
            if (moveVelocity.lengthSq() > 0) {
                // Apply force to physics body (ignoring Y for walk acceleration)
                playerBody.velocity.x += direction.x * speed * dt;
                playerBody.velocity.z += direction.z * speed * dt;
            }
            
            // Limit horizontal velocity
            const maxSpeed = 8;
            const horizVel = new THREE.Vector2(playerBody.velocity.x, playerBody.velocity.z);
            if (horizVel.length() > maxSpeed) {
                horizVel.normalize().multiplyScalar(maxSpeed);
                playerBody.velocity.x = horizVel.x;
                playerBody.velocity.z = horizVel.y;
            }

            // Sync camera position to physics body
            camera.position.set(
                playerBody.position.x,
                playerBody.position.y + 0.5, // Eye level slightly above center of sphere
                playerBody.position.z
            );
        }

        function updateGrabPosition() {
            if (isGrabbing && grabConstraint) {
                // Keep kinematic body floating in front of camera
                const distance = 4; // Distance to hold object
                const targetPos = new THREE.Vector3(0, 0, -distance);
                targetPos.applyQuaternion(camera.quaternion);
                targetPos.add(camera.position);
                
                kinematicGrabBody.position.set(targetPos.x, targetPos.y, targetPos.z);
                // Reduce velocity of grabbed object to prevent crazy swinging
                grabConstraint.bodyB.velocity.scale(0.9, grabConstraint.bodyB.velocity);
                grabConstraint.bodyB.angularVelocity.scale(0.9, grabConstraint.bodyB.angularVelocity);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);

            if (lastCallTime !== undefined) {
                const dt = (time - lastCallTime) / 1000;
                
                // Step physics world
                world.step(timeStep, dt, 3);
                
                // Update player
                updatePlayerMovement(dt);
                
                // Update grab tool
                updateGrabPosition();

                // Sync Three.js meshes with Cannon.js bodies
                for (const obj of objectsToUpdate) {
                    obj.mesh.position.copy(obj.body.position);
                    obj.mesh.quaternion.copy(obj.body.quaternion);
                    
                    // Simple boundary check to respawn fallen objects
                    if (obj.body.position.y < -20) {
                        obj.body.position.set(0, 20, 0);
                        obj.body.velocity.set(0,0,0);
                    }
                }
            }
            lastCallTime = time;

            renderer.render(scene, camera);
        }
    </script>
</body>
